function getPref() {
  return new URLSearchParams(location.search).get('pref') || '';
}

function render() {
  const key = getPref();
  const d = DATA[key];
  const content = document.getElementById('content');

  if (!d) {
    content.innerHTML = `
      <div class="not-found">
        <h2>Prefecture Not Found</h2>
        <p style="margin-top:1rem;color:#666;">Please check the URL parameter and try again.</p>
        <a href="index.html" style="display:inline-block;margin-top:1.5rem;color:#c0392b;font-weight:700;">← Back to Map</a>
      </div>`;
    return;
  }

  document.getElementById('pageTitle').textContent =
    `${d.en} — Top 5 Travel Spots | Japan Travel Guide`;
  document.getElementById('pageDesc').content =
    `Travel guide for ${d.en}, Japan. Top 5 spots, food, transport, and souvenir recommendations. No.1: ${d.city}.`;
  document.getElementById('headerTitle').textContent = `${d.en} Travel Guide`;
  document.getElementById('headerSub').textContent = 'Top 5 Recommended Spots';

  const rankItems = d.top5.map((spot, i) => {
    const n = i + 1;
    const bc = n === 1 ? 'no1' : n === 2 ? 'no2' : n === 3 ? 'no3' : 'other';
    const li = n === 1 ? ' class="no1-item"' : '';
    const label = n === 1
      ? `<a class="no1-link" href="#no1-article">${spot} — Read full article ↓</a>`
      : n === 2
      ? `<a class="no2-link" href="#no2-article">${spot} — Read full article ↓</a>`
      : n === 3
      ? `<a class="no3-link" href="#no3-article">${spot} — Read full article ↓</a>`
      : spot;
    return `<li${li}><span class="rank-badge ${bc}">${n}</span>${label}</li>`;
  }).join('');

  const mkList = arr => arr.map(s => `<li>${s}</li>`).join('');

  content.innerHTML = `
    <div class="top5-card">
      <h2>${d.en} — Top 5 Recommended Spots</h2>
      <ul class="rank-list">${rankItems}</ul>
    </div>

    <article id="no1-article">
      <span class="label">No.1 Spot</span>
      <h2>${d.en} No.1 — ${d.top5[0]}</h2>

      <div class="section-head"><span class="icon">🏯</span> Attractions</div>
      <ul>${mkList(d.attractions)}</ul>

      <div class="section-head"><span class="icon">🍜</span> Food &amp; Drink</div>
      <ul>${mkList(d.food)}</ul>

      <div class="section-head"><span class="icon">🚃</span> Getting There</div>
      <ul>${mkList(d.transport)}</ul>

      <div class="section-head"><span class="icon">🛍️</span> Souvenirs</div>
      <ul>${mkList(d.souvenirs)}</ul>
    </article>

    ${d.spot2 ? `
    <article id="no2-article">
      <span class="label no2-label">No.2 Spot</span>
      <h2>${d.en} No.2 — ${d.top5[1]}</h2>
      <div class="section-head"><span class="icon">🏯</span> Attractions</div>
      <ul>${mkList(d.spot2.attractions)}</ul>
      <div class="section-head"><span class="icon">🚃</span> Getting There</div>
      <ul>${mkList(d.spot2.transport)}</ul>
    </article>` : ''}

    ${d.spot3 ? `
    <article id="no3-article">
      <span class="label no3-label">No.3 Spot</span>
      <h2>${d.en} No.3 — ${d.top5[2]}</h2>
      <div class="section-head"><span class="icon">🏯</span> Attractions</div>
      <ul>${mkList(d.spot3.attractions)}</ul>
      <div class="section-head"><span class="icon">🚃</span> Getting There</div>
      <ul>${mkList(d.spot3.transport)}</ul>
    </article>` : ''}`;
}

render();
</script>
